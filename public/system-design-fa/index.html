<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>System Design — دوره‌ی تعاملی</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --paper:#f4ebe0; --sheet:#f9f2e8; --card:#f8f0e6; --ink:#1d1b18; --muted:#6f6961;
  --line:#ddd3c5; --green:#cfe3b2; --green-2:#b2d491; --green-3:#7fc278; --btn:#bfe3a8;
  --violet:#e7ddf5; --orange:#fcdcbd; --mint:#dff0de; --rust:#d0683a; --amber-bg:#f7e3ae;
  --dns:#f2c230; --server:#5b8fd6; --db:#9b7ed9; --req:#e07b2a; --res:#4d9e57; --hs:#a5dd8e;
  --radius:12px; --shadow:1.5px 2.5px 0 var(--ink);
  color-scheme:light;
}
html[data-theme="dark"]{
  --paper:#211e1a; --sheet:#28241f; --card:#26231e; --ink:#efe6d6; --muted:#a3998b;
  --line:#342f28; --green:#3f4c2b; --green-2:#55663a; --green-3:#7fc278; --btn:#46582e;
  --violet:#3a3350; --orange:#4d3a24; --mint:#2c4030; --amber-bg:#4d3d1e;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Vazirmatn',system-ui,sans-serif;font-size:15.5px;line-height:1.75;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',monospace}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:inherit}
::selection{background:var(--green-2)}

/* ---------- header ---------- */
header.top{position:fixed;top:0;right:0;left:0;height:58px;z-index:60;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--sheet);border-bottom:1.5px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.logo-grid{display:grid;grid-template-columns:1fr 1fr;gap:2.5px;width:22px;height:22px}
.logo-grid i{border:1.5px solid var(--ink);border-radius:4px;background:var(--sheet)}
.logo-grid i.g{background:var(--green-3)}
.logo-name{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:16.5px;letter-spacing:-.3px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;margin-inline-start:8px}
nav.tabs button{background:transparent;border:1.5px solid transparent;border-radius:9px;padding:5px 13px;font-size:14px;font-weight:700;min-height:36px}
nav.tabs button:hover{border-color:var(--line)}
nav.tabs button.active{background:var(--green);border-color:var(--ink);box-shadow:1.5px 2px 0 var(--ink)}
.head-spacer{flex:1}
.search-btn{display:flex;align-items:center;gap:9px;background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:5px 12px;font-size:13px;color:var(--muted);min-height:38px;box-shadow:1.5px 2px 0 var(--ink)}
.search-btn:hover{background:var(--sheet)}
.search-btn kbd{font-family:'JetBrains Mono',monospace;font-size:11px;background:var(--sheet);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ink);direction:ltr}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--card);border:1.5px solid var(--ink);border-radius:10px;min-width:38px;min-height:38px;padding:5px 10px;font-size:13px;font-weight:700;box-shadow:1.5px 2px 0 var(--ink)}
.icon-btn:active,.search-btn:active{transform:translate(1px,1.5px);box-shadow:.5px 1px 0 var(--ink)}
.credit{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);white-space:nowrap}
.credit a{color:var(--ink);font-weight:700;text-decoration:none}
.credit a:hover{text-decoration:underline}
#burger{display:none}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:minmax(0,1fr) 302px;max-width:1920px;margin:0 auto;padding-top:58px}
main{grid-column:1;padding:22px 26px 70px;min-width:0}
aside.side{grid-column:2;border-inline-start:1.5px solid var(--line);background:var(--sheet);position:sticky;top:58px;height:calc(100vh - 58px);height:calc(100dvh - 58px);overflow-y:auto;padding:16px 14px 40px}
.side-head{display:flex;align-items:baseline;justify-content:space-between;padding:2px 6px 8px}
.side-head h2{margin:0;font-size:17px;font-weight:900}
.progress-label{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.4px}
.progress-label b{color:var(--ink)}
.progress-bar{height:6px;border:1.5px solid var(--ink);border-radius:99px;background:var(--card);overflow:hidden;margin:0 6px 14px}
.progress-bar i{display:block;height:100%;background:var(--green-3);transition:width .5s ease}
.mod{margin-bottom:16px}
.mod-head{display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:13.5px;font-weight:800}
.mod-head .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.mod-head .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ink);flex-shrink:0}
.lesson-link{display:flex;align-items:center;gap:9px;width:100%;text-align:start;background:transparent;border:1.5px solid transparent;border-radius:9px;padding:6px 8px;font-size:13.5px;line-height:1.5;min-height:38px}
.lesson-link:hover{background:var(--card)}
.lesson-link .lnum{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);width:20px;flex-shrink:0;text-align:center}
.lesson-link .lt{flex:1}
.lesson-link .seen{width:7px;height:7px;border-radius:50%;background:var(--green-3);flex-shrink:0;opacity:0}
.lesson-link.visited .seen{opacity:1}
.lesson-link.active{background:var(--green);border-color:var(--ink);box-shadow:1.5px 2px 0 var(--ink);font-weight:700}
.lesson-link.active .lnum{color:var(--ink)}

/* ---------- lesson ---------- */
.kicker{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kicker .fa-part{font-family:'Vazirmatn',sans-serif;font-size:12.5px}
.en3{font-family:'JetBrains Mono',monospace;letter-spacing:.8px}
.sec-label{margin:0 0 7px;font-size:11px;color:var(--muted);font-weight:700}
.kicker .mdot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink)}
h1.lesson-title{font-size:29px;font-weight:900;margin:6px 0 4px;line-height:1.35}
.lesson-summary{color:var(--muted);margin:0 0 12px;font-size:15.5px;max-width:70ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{font-size:12.5px;font-weight:700;background:var(--card);border:1.5px solid var(--ink);border-radius:99px;padding:2px 12px;box-shadow:1px 1.5px 0 var(--ink)}
.chip.level{background:var(--violet)}
.metrics{display:grid;gap:10px;margin-bottom:14px;direction:ltr}
.metrics.c5{grid-template-columns:repeat(5,116px);justify-content:start}
.metrics.c4{grid-template-columns:repeat(4,132px);justify-content:start}
.metric{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:7px 12px 5px;min-width:0;min-height:55px}
.metric .mlabel{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.6px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:left}
.metric .mval{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:800;line-height:1.3;direction:ltr;text-align:left}
.metric .mval small{font-size:12px;font-weight:600;color:var(--muted);margin-inline-start:3px}
.metric.total{background:var(--green)}
.lesson-grid{display:grid;grid-template-columns:348px minmax(0,1fr);gap:16px;align-items:start}
.stage-card{background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px;overflow:hidden}
.stage-card svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 4px 2px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block}
.panel{display:flex;flex-direction:column;gap:12px}
.pcard{background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.pcard h3{margin:0 0 8px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.pcard h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--green-3);border:1.5px solid var(--ink)}
.step-phase{display:inline-block;font-size:11.5px;font-weight:800;background:var(--orange);border:1.5px solid var(--ink);border-radius:99px;padding:0 10px;margin-bottom:8px}
.step-head{font-size:20px;font-weight:900;margin:0 0 8px;line-height:1.45}
.step-body p{margin:0 0 9px}
.step-body p:last-child{margin-bottom:0}
.step-body .en,.metric .mval,.mono-en{font-family:'JetBrains Mono',monospace}
.callout{border:1.5px solid var(--ink);border-radius:var(--radius);padding:11px 14px;box-shadow:var(--shadow)}
.callout .ctag{display:inline-block;font-size:11.5px;font-weight:900;background:var(--sheet);border:1.5px solid var(--ink);border-radius:99px;padding:0 10px;margin-bottom:6px}
.callout p{margin:0}
.callout.insight{background:var(--violet)} .callout.tip{background:var(--mint)}
.callout.warn{background:var(--amber-bg)} .callout.next{background:var(--green)}
.callout ul{margin:0;padding-inline-start:20px}
.changes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.changes li{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.6}
.changes .mk{font-family:'JetBrains Mono',monospace;font-weight:800;width:21px;height:21px;flex-shrink:0;border:1.5px solid var(--ink);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;margin-top:2px}
.changes .mk.plus{background:var(--green)} .changes .mk.tilde{background:var(--orange)} .changes .mk.minus{background:#f3b8a2}
.learn-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.learn-list button{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:start;background:transparent;border:1.5px solid transparent;border-radius:9px;padding:6px 8px;font-size:13.5px;line-height:1.6;min-height:36px}
.learn-list button:hover{background:var(--card);border-color:var(--line)}
.learn-list .snum{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;background:var(--card);border:1.5px solid var(--ink);border-radius:50%;width:22px;height:22px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;margin-top:1px}

/* step strip + controls */
.strip-card{margin-top:16px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:13px 16px}
.strip-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:11px}
.strip-top h3{margin:0;font-size:11.5px;color:var(--muted)}
.strip-top .step-count{font-size:12.5px;color:var(--muted)}
.circles{display:flex;justify-content:space-between;gap:4px}
.citem{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.citem .clabel{font-size:11px;color:var(--muted);text-align:center;line-height:1.35;max-width:100px}
.citem.cur .clabel{color:var(--ink);font-weight:700}
.circles button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);background:var(--card);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;padding:0;flex-shrink:0}
.circles button:hover{background:var(--green)}
.circles button.done{background:var(--green)}
.circles button.cur{background:var(--green-3);color:#12240c;box-shadow:1.5px 2px 0 var(--ink);transform:scale(1.08)}
html[data-theme="dark"] .circles button.cur{color:#0e1a08}
.controls{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:10px;background:var(--sheet);padding:7px 18px;font-size:14.5px;font-weight:800;min-height:42px;box-shadow:var(--shadow)}
.btn:active{transform:translate(1px,2px);box-shadow:.5px 1px 0 var(--ink)}
.btn.primary{background:var(--btn)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{flex-shrink:0}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px;flex-wrap:wrap}
.lesson-nav a{display:block;text-decoration:none;background:var(--card);border:1.5px solid var(--ink);border-radius:var(--radius);box-shadow:var(--shadow);padding:11px 16px;max-width:46%;min-height:44px}
.lesson-nav a:hover{background:var(--green)}
.lesson-nav .dir{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--muted);letter-spacing:.6px}
.lesson-nav .t{font-weight:800;font-size:14.5px}
.lesson-nav a.next-l{margin-inline-start:auto;text-align:end}

/* time bars (lesson 1 step 10) */
.timebars{padding:8px 6px 4px}
.timebars h4{margin:0 0 14px;font-size:11.5px;color:var(--muted)}
.tb-row{display:grid;grid-template-columns:170px 1fr 74px;gap:12px;align-items:center;margin-bottom:12px}
.tb-row .tl{font-family:'JetBrains Mono',monospace;font-size:12px;direction:ltr;text-align:left}
.tb-track{height:22px;border:1.5px solid var(--ink);border-radius:7px;background:var(--sheet);overflow:hidden}
.tb-fill{height:100%;width:0;transition:width 1s cubic-bezier(.2,.8,.25,1)}
.tb-row .tv{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;direction:ltr;text-align:left}
.tb-total{border-top:1.5px dashed var(--muted);padding-top:11px;font-size:14.5px}
.tb-total b{font-family:'JetBrains Mono',monospace}

/* placeholder */
.placeholder{background:var(--card);border:1.5px dashed var(--ink);border-radius:var(--radius);padding:44px 26px;text-align:center}
.placeholder .big{font-size:21px;font-weight:900;margin:0 0 8px}
.placeholder p{color:var(--muted);margin:0 auto;max-width:52ch}
.placeholder .qmark{font-family:'JetBrains Mono',monospace;font-size:44px;font-weight:800;color:var(--muted);display:block;margin-bottom:10px}

/* ---------- search modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(20,16,10,.45);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:9vh 14px 14px}
.overlay.open{display:flex}
.modal{background:var(--sheet);border:1.5px solid var(--ink);border-radius:14px;box-shadow:4px 6px 0 rgba(20,16,10,.35);width:min(620px,100%);max-height:78vh;display:flex;flex-direction:column;overflow:hidden}
.modal-head{padding:16px 18px 10px;border-bottom:1.5px solid var(--line)}
.modal-head h2{margin:0 0 10px;font-size:18px;font-weight:900}
.modal-head input{width:100%;font-family:inherit;font-size:15px;padding:10px 14px;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);min-height:44px}
.modal-head input:focus{outline:2px solid var(--green-3);outline-offset:1px}
.modal-stats{font-size:12.5px;color:var(--muted);margin-top:9px}
.modal-results{overflow-y:auto;padding:8px}
.result{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:start;background:transparent;border:1.5px solid transparent;border-radius:10px;padding:9px 11px;min-height:44px}
.result:hover{background:var(--card)}
.result.sel{background:var(--green);border-color:var(--ink)}
.result .rn{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);background:var(--card);border:1.5px solid var(--ink);border-radius:7px;padding:1px 7px;flex-shrink:0;margin-top:2px}
.result .rt{font-weight:800;font-size:14.5px;line-height:1.5}
.result .rs{color:var(--muted);font-size:12.5px;line-height:1.55}
.result .rk{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.5px}
.no-results{padding:22px;text-align:center;color:var(--muted)}

/* toast */
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--paper);border-radius:11px;padding:10px 22px;font-size:14.5px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:120;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.side-backdrop{display:none}

/* svg diagram bits */
svg text{font-family:'JetBrains Mono',monospace}
svg text.ltr{direction:ltr;unicode-bidi:isolate}
svg .fa{font-family:'Vazirmatn',sans-serif}
.dim{opacity:.45}
.pill-bg{fill:var(--sheet);stroke:var(--ink);stroke-width:2.5}
.panel{animation:panelIn .55s ease both}
@keyframes panelIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
.node-in{animation:nodeIn 1.05s ease both}
@keyframes nodeIn{from{opacity:.15}to{opacity:1}}
html[data-theme="dark"] .pill-bg{fill:#2e2a24}
.ent-label{font-size:13px;font-weight:700;fill:var(--ink)}
.ent-sub{font-size:10.5px;fill:var(--muted)}
.dash-line{stroke:var(--muted);stroke-width:1.6;stroke-dasharray:5 5;fill:none}
@media (prefers-reduced-motion: reduce){
  .tb-fill{transition:none}
  .panel,.node-in{animation:none}
}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  .lesson-grid{grid-template-columns:300px minmax(0,1fr)}
}
@media (max-width:1023px){
  #burger{display:inline-flex}
  .shell{grid-template-columns:minmax(0,1fr)}
  main{grid-column:1;padding:18px 14px 60px}
  aside.side{display:none;position:fixed;top:0;bottom:0;left:0;right:auto;width:302px;z-index:100;height:100dvh;border-inline-start:none;border-inline-end:1.5px solid var(--ink)}
  aside.side.open{display:block;box-shadow:6px 0 30px rgba(0,0,0,.25);animation:slideIn .25s ease}
  @keyframes slideIn{from{transform:translateX(-26px);opacity:.4}to{transform:translateX(0);opacity:1}}
  .logo-name{display:none}
  .side-backdrop{display:block;position:fixed;inset:0;background:rgba(20,16,10,.45);z-index:95;opacity:0;pointer-events:none;transition:.25s}
  .side-backdrop.show{opacity:1;pointer-events:auto}
  .lesson-grid{grid-template-columns:1fr}
  .panel{order:2}.stage-wrap{order:1}
  nav.tabs{display:none}
  .credit{display:none}
  .metrics.c5{grid-template-columns:repeat(3,1fr)}
  .metrics.c4{grid-template-columns:repeat(2,1fr)}
  .search-btn .sb-text{display:none}
  h1.lesson-title{font-size:24px}
  .tb-row{grid-template-columns:110px 1fr 62px}
  .lesson-nav a{max-width:100%;width:100%}
  .lesson-nav a.next-l{text-align:start}
}
@media (max-width:640px){
  .metrics.c5{grid-template-columns:repeat(2,1fr)}
  .metric .mlabel{font-size:9px;letter-spacing:.2px;white-space:normal}
  .metric .mval{font-size:21px}
  .search-btn kbd{display:none}
}
</style>
</head>
<body>

<header class="top">
  <button class="icon-btn" id="burger" aria-label="باز کردن فهرست درس‌ها">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="logo" href="#/">
    <span class="logo-grid"><i class="g"></i><i></i><i></i><i></i></span>
    <span class="logo-name" dir="ltr">System Design</span>
  </a>
  <nav class="tabs" aria-label="بخش‌های سایت">
    <button class="active" type="button">یادگیری</button>
    <button type="button" data-soon>تمرین</button>
    <button type="button" data-soon>آزمایشگاه طراحی</button>
    <button type="button" data-soon>برگه‌های تقلب</button>
  </nav>
  <div class="head-spacer"></div>
  <button class="search-btn" id="openSearch" type="button" aria-label="جستجوی دوره">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/></svg>
    <span class="sb-text">جستجو در درس‌ها و مفاهیم…</span>
    <kbd>Ctrl+K</kbd>
  </button>

    +'<text x="'+scx+'" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="var(--ink)">SERVER</text>'
    +'<rect x="'+(scx-58)+'" y="210" width="116" height="15" rx="7" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.5"/>'
    +'<rect x="'+(scx-58)+'" y="210" width="'+(116*util/100)+'" height="15" rx="7" fill="'+uc+'"/>'
    +'<text class="ltr" x="'+scx+'" y="248" text-anchor="middle" font-size="11" fill="var(--muted)">UTILIZATION '+util+'%</text>';
  if(s===6) p+=pill(scx,128,178,"در پرواز ≈ ۴۲ درخواست",true);
  if(queue>0){
    for(i=0;i<queue;i++) p+='<circle cx="'+(scx-(queue-1)*15+i*30)+'" cy="292" r="8" fill="#b9ac97" stroke="var(--ink)" stroke-width="1.5"/>';
    p+='<text class="fa" x="'+scx+'" y="326" text-anchor="middle" font-size="12.5" fill="var(--muted)">در صف: '+queue+' درخواست</text>';
  }
  return p+"</svg>";
}

/* ---- lesson 3 diagram ---- */
function diagram3(s){

  var cyls=""; [92,128,164].forEach(function(cx){ cyls+='<g><rect x="'+(cx-13)+'" y="'+(82+4*52+12)+'" width="26" height="20" fill="#a98fe3" stroke="var(--ink)" stroke-width="1.2"/><ellipse cx="'+cx+'" cy="'+(82+4*52+12)+'" rx="13" ry="5" fill="#c9b6f2" stroke="var(--ink)" stroke-width="1.2"/></g>'; });
  var cloud='<path d="M 96 372 a13 13 0 1 1 5 -25 a17 17 0 0 1 32 -5 a12 12 0 1 1 7 30 z" fill="var(--mint)" stroke="var(--ink)" stroke-width="1.5"/>';
  var cache='<rect x="82" y="'+(82+6*52+12)+'" width="96" height="20" rx="5" fill="var(--green-2)" stroke="var(--ink)" stroke-width="1.4"/><text class="ltr" x="130" y="'+(82+6*52+26)+'" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--ink)">21 GB</text>';
  if(s!==7){

function stageHTML(slug,s){
  if(slug==="request-lifecycle") return diagram1(s);

<script>
"use strict";
/* ================= app ================= */
var $=function(id){return document.getElementById(id);};
var FA="۰۱۲۳۴۵۶۷۸۹";
function faNum(n){ return String(n).replace(/[0-9]/g,function(d){return FA[+d];}); }
function fmt(n){ return n.toLocaleString("en-US"); }
var state={slug:"request-lifecycle",step:1};
var playing=true, timer=null, visited={}, mv=[], prevSlug=null;
var reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("show");},2200);
}

/* ---------- sidebar ---------- */
function renderSidebar(){
  var h='<div class="side-head"><h2>دوره</h2><span class="progress-label">PROGRESS — <b>'+faNum(Object.keys(visited).length)+' / '+faNum(40)+'</b></span></div>'
    +'<div class="progress-bar"><i style="width:'+(Object.keys(visited).length/40*100)+'%"></i></div>';
  MODULES.forEach(function(m,mi){
    h+='<div class="mod"><div class="mod-head"><span class="num">'+m.n+'</span><span class="dot" style="background:'+m.color+'"></span>'+m.name+'</div>';
    LESSONS.forEach(function(l){
      if(l.mod!==mi) return;
      h+='<button type="button" class="lesson-link'+(l.slug===state.slug?" active":"")+(visited[l.slug]?" visited":"")+'" data-goto="'+l.slug+'"><span class="lnum">'+(l.idx+1)+'</span><span class="lt">'+l.title+'</span><span class="seen"></span></button>';
    });
    h+='</div>';
  });
  $("sidebar").innerHTML=h;
  var links=$("sidebar").querySelectorAll("[data-goto]");
  for(var i=0;i<links.length;i++) links[i].addEventListener("click",function(){
    goLesson(this.getAttribute("data-goto"),1,true); closeSide();
  });
  var act=$("sidebar").querySelector(".lesson-link.active");
  if(act) act.scrollIntoView({block:"nearest"});
}

/* ---------- metrics animation ---------- */
function setMetric(i,target,defUnit){
  var el=$("mv"+i); if(!el) return;
  var unitEl=$("mu"+i);
  var cur=mv[i];
  if(target===null||target===undefined){ el.textContent="—"; if(unitEl)unitEl.textContent=""; mv[i]=null; return; }
  if(typeof target==="string"){ el.textContent=target; if(unitEl)unitEl.textContent=""; mv[i]=null; return; }
  var val=target, unit=defUnit;
  if(typeof target==="object"){ val=target.v; unit=target.u||defUnit; }
  if(unitEl) unitEl.textContent=unit||"";
  if(reduced||typeof cur!=="number"){ el.textContent=fmt(val); mv[i]=val; return; }
  var from=cur, start=null;
  function tick(ts){
    if(!document.body.contains(el)) return;
    if(start===null) start=ts;
    var t=Math.min(1,(ts-start)/950), e=1-Math.pow(1-t,3);
    el.textContent=fmt(Math.round(from+(val-from)*e));
    if(t<1) requestAnimationFrame(tick); else mv[i]=val;
  }
  requestAnimationFrame(tick);
}

/* ---------- lesson render ---------- */
function lessonHead(l){
  var m=MODULES[l.mod];
  return '<div class="kicker"><span class="mdot" style="background:'+m.color+'"></span><span>LESSON '+(l.idx+1)+' / 40</span><span>·</span><span>MODULE '+m.n+' — </span><span class="fa-part">'+m.name+'</span></div>'
    +'<h1 class="lesson-title">'+l.title+'</h1>'
    +'<p class="lesson-summary">'+l.summary+'</p>'
    +'<div class="chips"><span class="chip level">'+l.level+'</span><span class="chip">'+faNum(l.mins)+' دقیقه</span><span class="chip">'+faNum(l.steps)+' مرحله</span></div>';
}
function lessonNav(l){
  var prev=LESSONS[l.idx-1], next=LESSONS[l.idx+1], h='<div class="lesson-nav">';
  if(prev) h+='<a href="#/'+prev.slug+'/1"><span class="dir">→ PREV LESSON</span><br><span class="t">'+prev.title+'</span></a>';
  if(next) h+='<a class="next-l" href="#/'+next.slug+'/1"><span class="dir">NEXT LESSON ←</span><br><span class="t">'+next.title+'</span></a>';
  return h+'</div>';
}
var CTAG={insight:"نکته",tip:"نکته‌ی کاربردی",warn:"مراقب باشید",next:"بعدی"};
function render(){
  var l=bySlug[state.slug]; if(!l){ l=LESSONS[0]; state.slug=l.slug; }
  if(prevSlug!==l.slug){ mv=[]; prevSlug=l.slug; }
  var det=DETAILS[l.slug];
  visited[l.slug]=true;
  var total=det?det.steps.length:0;
  if(det&&state.step>total) state.step=total;
  if(state.step<1) state.step=1;
  var h=lessonHead(l);
  if(!det){
    h+='<div class="placeholder"><span class="qmark">?</span><p class="big">محتوای این درس هنوز آماده نیست</p><p>در نسخه‌ی اصلی این درس کامل است؛ در این کلون فقط سه درس اول کامل ساخته شده‌اند.</p></div>'
      +lessonNav(l);
    $("main").innerHTML=h;
    stopTimer(); renderSidebar(); window.scrollTo(0,0);
    return;
  }
  var st=det.steps[state.step-1];
  /* metrics */
  h+='<div class="metrics '+(det.metrics.length===5?"c5":"c4")+'">';
  det.metrics.forEach(function(m,i){
    h+='<div class="metric'+(i===det.metrics.length-1&&(l.slug!=="latency-throughput")&&st.metrics&&st.metrics[i]!=null?" total":"")+'"><div class="mlabel">'+m[0]+'</div><div class="mval"><span id="mv'+i+'">—</span><small id="mu'+i+'"></small></div></div>';
  });
  h+='</div>';
  /* grid: panel + stage */
  h+='<div class="lesson-grid"><div class="panel">';
  h+='<div class="pcard"><h3><span class="en3">KEY IDEA</span> — ایده‌ی کلیدی</h3>'
    +'<span class="step-phase">'+st.phase+'</span>'
    +'<h2 class="step-head">'+st.head+'</h2><div class="step-body">';
  (st.body||[]).forEach(function(p){ h+='<p>'+p+'</p>'; });
  if(st.bullets){
    h+='<ul style="margin:4px 0 0;padding-inline-start:20px">';
    st.bullets.forEach(function(b){ h+='<li>'+b+'</li>'; });
    h+='</ul>';
  }
  if(st.table){
    h+='<div style="margin-top:10px;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden">';
    st.table.forEach(function(r,i){
      h+='<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 13px;'+(i<st.table.length-1?"border-bottom:1px solid var(--line);":"")+'"><span>'+r[0]+'</span><span class="mono" dir="ltr" style="font-weight:700;white-space:nowrap">'+r[1]+'</span></div>';
    });
    h+='</div>';
  }
  h+='</div></div>';
  if(st.callout){
    h+='<div><h3 class="sec-label"><span class="en3">GOOD TO KNOW</span> — خوب است بدانید</h3>'
      +'<div class="callout '+st.callout.t+'"><span class="ctag">'+CTAG[st.callout.t]+'</span><p>'+st.callout.text+'</p></div></div>';
  }
  if(st.changes){
    h+='<div class="pcard"><h3><span class="en3">WHAT CHANGED</span> — چه چیزی تغییر کرد</h3><ul class="changes">';
    st.changes.forEach(function(c){
      var cls=c[0]==="+"?"plus":(c[0]==="−"?"minus":"tilde");
      var sym=c[0]==="+"?"+":(c[0]==="−"?"−":"~");
      h+='<li><span class="mk '+cls+'">'+sym+'</span><span>'+c[1]+'</span></li>';
    });
    h+='</ul></div>';
  }
  h+='<div class="pcard"><h3><span class="en3">YOU\'LL LEARN</span> — چه چیزی یاد می‌گیرید</h3><ul class="learn-list">';
  det.learn.forEach(function(it){
    h+='<li><button type="button" data-jump="'+it[1]+'"><span class="snum">'+it[1]+'</span><span>'+it[0]+'</span></button></li>';
  });
  h+='</ul></div>';
  h+='</div>'; /* panel */
  h+='<div class="stage-wrap"><div class="stage-card" id="stageCard">'+stageHTML(l.slug,state.step-1);
  h+='<div class="legend">'+det.legend.map(function(g){return '<span><i style="background:'+g[0]+'"></i>'+g[1]+'</span>';}).join("")+'</div>';
  h+='</div>';
  /* strip + controls */
  h+='<div class="strip-card"><div class="strip-top"><h3><span class="en3">IN THIS LESSON</span> — در این درس</h3><span class="step-count">مرحله‌ی '+faNum(state.step)+' از '+faNum(total)+' · '+st.name+'</span></div><div class="circles">';
  var SHORT1=["Hit Enter","Find address","Connect","Request","Fetch data","Response","More files","Slow query","Far away","Recap"];
  det.steps.forEach(function(s2,i){
    var lbl=(l.slug==="request-lifecycle")?SHORT1[i]:s2.name;
    h+='<div class="citem'+(i+1===state.step?" cur":"")+'"><button type="button" data-step="'+(i+1)+'" class="'+(i+1===state.step?"cur":(i+1<state.step?"done":""))+'" aria-label="مرحله‌ی '+faNum(i+1)+': '+s2.name+'">'+(i+1)+'</button><span class="clabel"'+(l.slug==="request-lifecycle"?' dir="ltr"':'')+'>'+lbl+'</span></div>';
  });
  h+='</div><div class="controls">'

    +'<button type="button" class="btn" id="btnBack"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>قبلی</button>'
    +'<button type="button" class="btn primary" id="btnNext">بعدی<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>'
    +'<button type="button" class="btn" id="btnReplay"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>تکرار</button>'
    +'<button type="button" class="btn" id="btnPlay"></button>'
    +'</div></div></div></div>';
  h+=lessonNav(l);
  $("main").innerHTML=h;
  /* metrics values */
  det.metrics.forEach(function(m,i){ setMetric(i, st.metrics?st.metrics[i]:null, m[1]); });
  /* time bars animation */
  var fills=$("main").querySelectorAll(".tb-fill");
  if(fills.length) requestAnimationFrame(function(){ requestAnimationFrame(function(){
    for(var i=0;i<fills.length;i++) fills[i].style.width=fills[i].getAttribute("data-w")+"%";
  });});
  /* wire controls */
  $("btnBack").addEventListener("click",prevStep);
  $("btnNext").addEventListener("click",nextStep);
  $("btnReplay").addEventListener("click",replay);
  $("btnPlay").addEventListener("click",togglePlay);
  var cs=$("main").querySelectorAll("[data-step]");
  for(var i=0;i<cs.length;i++) cs[i].addEventListener("click",function(){ goStep(+this.getAttribute("data-step")); });
  var js=$("main").querySelectorAll("[data-jump]");
  for(var j=0;j<js.length;j++) js[j].addEventListener("click",function(){ goStep(+this.getAttribute("data-jump")); });
  updatePlayBtn();
  renderSidebar();
  schedule();
}
function updatePlayBtn(){
  var b=$("btnPlay"); if(!b) return;
  b.innerHTML=playing
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="4" width="5" height="16" rx="1.4"/><rect x="14" y="4" width="5" height="16" rx="1.4"/></svg>توقف'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.8v14.4c0 1 1.1 1.6 2 1.1l11-7.2c.8-.5.8-1.7 0-2.2L9 3.8c-.9-.6-2 0-2 1z"/></svg>پخش';
}

/* ---------- navigation / autoplay ---------- */
function setHash(){ var t="#/"+state.slug+"/"+state.step; if(location.hash!==t) location.hash=t; }
function goLesson(slug,step,play){
  state.slug=slug; state.step=step||1; if(play) playing=true;
  setHash(); render();
}
function goStep(n){ state.step=n; setHash(); render(); }
function nextStep(){
  var l=bySlug[state.slug], det=DETAILS[l.slug];
  if(det&&state.step<det.steps.length){ goStep(state.step+1); return; }
  var nx=LESSONS[l.idx+1];
  if(nx) goLesson(nx.slug,1,true);
}
function prevStep(){
  var l=bySlug[state.slug], det=DETAILS[l.slug];
  if(det&&state.step>1){ goStep(state.step-1); return; }
  var pv=LESSONS[l.idx-1];
  if(pv){ var pd=DETAILS[pv.slug]; goLesson(pv.slug, pd?pd.steps.length:1, playing); }
}
function replay(){ state.step=1; playing=true; setHash(); render(); }
function applyPlayState(){
  var svgs=document.querySelectorAll("#stageCard svg");
  for(var i=0;i<svgs.length;i++){
    if(playing){ if(svgs[i].unpauseAnimations) svgs[i].unpauseAnimations(); }
    else if(svgs[i].pauseAnimations) svgs[i].pauseAnimations();
  }
}
function togglePlay(){
  var l=bySlug[state.slug], det=DETAILS[l.slug];
  if(!det) return;
  playing=!playing; updatePlayBtn(); applyPlayState();
}
function stopTimer(){ if(timer){ clearTimeout(timer); timer=null; } }
function schedule(){
  /* no auto-advance: steps never move on their own; Pause only freezes the moving dots */
  stopTimer(); applyPlayState();
}
function route(){
  var m=location.hash.match(/^#\/([a-z0-9-]+)(?:\/(\d+))?/);
  if(m&&bySlug[m[1]]){
    var changed=(m[1]!==state.slug);
    state.slug=m[1]; state.step=m[2]?Math.max(1,parseInt(m[2],10)):1;
    if(changed) playing=true;
  } else { state.slug="request-lifecycle"; state.step=1; }
  render();
}
window.addEventListener("hashchange",route);

/* ---------- search ---------- */
var searchOpen=false, selIdx=0, results=[];
function buildResults(q){
  q=(q||"").trim().toLowerCase(); results=[];
  LESSONS.forEach(function(l){
    if(!q||l.title.toLowerCase().indexOf(q)>-1||l.summary.toLowerCase().indexOf(q)>-1||l.slug.indexOf(q)>-1)
      results.push({slug:l.slug,step:1,kind:"LESSON "+(l.idx+1),title:l.title,sub:l.summary});
  });
  if(q){
    LESSONS.forEach(function(l){
      var det=DETAILS[l.slug]; if(!det) return;
      det.steps.forEach(function(s,i){
        if(s.name.toLowerCase().indexOf(q)>-1||s.head.toLowerCase().indexOf(q)>-1)
          results.push({slug:l.slug,step:i+1,kind:"STEP "+(i+1),title:s.head,sub:l.title});
      });
    });
  }
  return results;
}
function renderResults(){
  var box=$("searchResults");
  if(!results.length){ box.innerHTML='<div class="no-results">نتیجه‌ای پیدا نشد.</div>'; return; }
  box.innerHTML=results.map(function(r,i){
    return '<button type="button" class="result'+(i===selIdx?" sel":"")+'" data-ri="'+i+'"><span class="rn">'+(i+1)+'</span><span><span class="rk">'+r.kind+'</span><br><span class="rt">'+r.title+'</span><br><span class="rs">'+r.sub+'</span></span></button>';
  }).join("");
  var btns=box.querySelectorAll("[data-ri]");
  for(var i=0;i<btns.length;i++) btns[i].addEventListener("click",function(){ openResult(+this.getAttribute("data-ri")); });
  var sel=box.querySelector(".result.sel"); if(sel) sel.scrollIntoView({block:"nearest"});
}
function openResult(i){
  var r=results[i]; if(!r) return;
  closeSearch(); goLesson(r.slug,r.step,true);
}
function openSearch(){
  searchOpen=true; $("searchOverlay").classList.add("open");
  $("searchInput").value=""; selIdx=0; buildResults(""); renderResults();
  setTimeout(function(){ $("searchInput").focus(); },30);
}
function closeSearch(){ searchOpen=false; $("searchOverlay").classList.remove("open"); }
$("openSearch").addEventListener("click",openSearch);
$("searchOverlay").addEventListener("click",function(e){ if(e.target===this) closeSearch(); });
$("searchInput").addEventListener("input",function(){ selIdx=0; buildResults(this.value); renderResults(); });

/* ---------- header bits ---------- */
document.querySelectorAll("[data-soon]").forEach(function(b){ b.addEventListener("click",function(){ toast("به‌زودی می‌آید"); }); });
$("langBtn").addEventListener("click",function(){ toast("به‌زودی می‌آید"); });
$("themeBtn").addEventListener("click",function(){
  var dark=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",dark?"light":"dark");
  $("themeIconMoon").style.display=dark?"":"none";
  $("themeIconSun").style.display=dark?"none":"";
});
function closeSide(){ $("sidebar").classList.remove("open"); $("sideBackdrop").classList.remove("show"); }
$("burger").addEventListener("click",function(){
  var open=$("sidebar").classList.toggle("open");
  $("sideBackdrop").classList.toggle("show",open);
});
$("sideBackdrop").addEventListener("click",closeSide);

/* ---------- keyboard ---------- */
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); searchOpen?closeSearch():openSearch(); return; }
  if(searchOpen){
    if(e.key==="Escape"){ closeSearch(); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); selIdx=Math.min(results.length-1,selIdx+1); renderResults(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); selIdx=Math.max(0,selIdx-1); renderResults(); }
    else if(e.key==="Enter"){ e.preventDefault(); openResult(selIdx); }
    return;
  }
  if(e.key==="Escape"){ closeSide(); return; }
  var tag=(e.target&&e.target.tagName)||"";
  if(tag==="INPUT"||tag==="TEXTAREA") return;
  if(e.key===" "){ e.preventDefault(); togglePlay(); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); nextStep(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); prevStep(); }
  else if(e.key.toLowerCase()==="r"){ replay(); }
});

/* ---------- init ---------- */
/* always start in light theme, regardless of the OS setting; dark only via the theme button */
route();
</script>
</body>
</html>
